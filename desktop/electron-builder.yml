appId: com.insightbooks.desktop
productName: Insight Books Desktop
directories:
  output: dist
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - runSync.cjs
  - package.json
  - from: ../lib/desktop
    to: lib/desktop
    filter:
      - "**/*"
  - from: ../node_modules/better-sqlite3
    to: node_modules/better-sqlite3
    filter:
      - "**/*"
asarUnpack:
  - "**/better-sqlite3/**"
extraResources:
  - from: ../.next/standalone
    to: standalone
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: InsightBooks-desktop-setup.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
